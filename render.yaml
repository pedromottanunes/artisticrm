# Homologação: Web Service Free + MongoDB Atlas externo. Não usar para operação real.
services:
  - type: web
    name: artisti-crm
    runtime: node
    plan: free
    region: oregon
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -w backend
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_ENABLED
        value: 'false'
      - key: INSTAGRAM_ENABLED
        value: 'false'
      - key: META_MARKETING_ENABLED
        value: 'false'
      - key: META_GRAPH_VERSION
        value: v26.0
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_VERIFY_TOKEN
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_USERNAME
        sync: false
      - key: META_MARKETING_ACCESS_TOKEN
        sync: false
      - key: META_AD_ACCOUNT_ID
        sync: false
      - key: META_AD_TIMEZONE
        value: America/Sao_Paulo
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: artisti
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
