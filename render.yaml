# Blueprint de homologação. Recursos pagos: revise os planos antes de aplicar.
services:
  - type: web
    name: artisti-crm
    runtime: node
    plan: 0.5c-512mb
    region: virginia
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run migrate -w backend
    startCommand: npm run start -w backend
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_ENABLED
        value: 'false'
      - key: DATABASE_URL
        fromDatabase:
          name: artisti-crm-db
          property: connectionString
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
databases:
  - name: artisti-crm-db
    databaseName: artisti
    user: artisti
    region: virginia
    plan: 0.1c-256mb
    diskSizeGB: 5
    postgresMajorVersion: '18'
    ipAllowList: []
