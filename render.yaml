# Homologação Free. PostgreSQL expira em 30 dias; não usar para operação real.
services:
  - type: web
    name: artisti-crm
    runtime: node
    plan: free
    region: virginia
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -w backend
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_ENABLED
        value: 'false'
      - key: DATABASE_URL
        fromDatabase:
          name: artisti-crm-db
          property: connectionString
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
databases:
  - name: artisti-crm-db
    databaseName: artisti
    user: artisti
    region: virginia
    plan: free
    postgresMajorVersion: '18'
    ipAllowList: []
