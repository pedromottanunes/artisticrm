name: Validate CRM
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: artisti_test
          POSTGRES_PASSWORD: test_only_local_ci
          POSTGRES_DB: artisti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artisti_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://artisti_test:test_only_local_ci@localhost:5432/artisti_test
      - run: npm run build
      - run: npm run test:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
