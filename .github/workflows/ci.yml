name: Validate CRM
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tracked credential files
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(TOKENS\.txt|[^/]+\.tokens\.txt|\.env($|\..+))$' | grep -Eiv '(^|/)\.env\.example$'; then
            echo 'Credential files must not be tracked in Git.'
            exit 1
          fi
      - name: Scan Git history for secrets (redacted)
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: artisti_test
          POSTGRES_PASSWORD: test_only_local_ci
          POSTGRES_DB: artisti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artisti_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://artisti_test:test_only_local_ci@localhost:5432/artisti_test
      - run: npm run build
      - run: npm run test:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
